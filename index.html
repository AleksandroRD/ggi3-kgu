<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Library</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="menu.css">
  </head>
  <body>
    <header class="menu-head">
      <h1>Grundgebiete der Informatik 3</h1>
      <p>Pick a book to open its presentation</p>
    </header>

    <main id="shelf" class="case" aria-label="Presentations"></main>

    <!-- animation layer: the book that is pulled off the shelf lives here -->
    <div id="stage" aria-hidden="true"></div>

    <!-- the presentation itself -->
    <div id="viewer">
      <iframe id="frame" title="Presentation" src="about:blank"></iframe>
      <button id="back" type="button">&larr; Library</button>
    </div>

    <script src="menu.js"></script>
  </body>
</html>
